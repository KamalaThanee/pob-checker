<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POB Checker - Kamala Thanee</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 45%, #0f172a 100%);
            color: #f1f5f9;
        }
        .wrap { max-width: 56rem; margin: 0 auto; padding: 1rem; }
        .card {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid #334155;
            border-radius: 1.25rem;
            padding: 1.25rem;
        }
        .hero { text-align: center; padding: 1.5rem; margin-bottom: 1rem; }
        .hero h1 { font-size: 1.75rem; font-weight: 900; color: #60a5fa; margin: 0.25rem 0; }
        .hero p { color: #94a3b8; font-size: 0.875rem; margin: 0; }
        .grid2 { display: grid; gap: 1rem; }
        @media (min-width: 768px) { .grid2 { grid-template-columns: 1fr 1fr; } }
        label.lbl { display: block; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
        .lbl-excel { color: #93c5fd; }
        .lbl-img { color: #86efac; }
        input[type=file] {
            width: 100%; font-size: 0.8rem;
            padding: 0.6rem; border-radius: 0.75rem;
            border: 1px dashed #475569;
            background: #0f172a; color: #e2e8f0;
        }
        #mainBtn {
            width: 100%; margin-top: 0.5rem;
            padding: 1.1rem; font-size: 1.15rem; font-weight: 800;
            border: none; border-radius: 1rem; cursor: pointer;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white; box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
        }
        #mainBtn:disabled { opacity: 0.6; cursor: wait; }
        .hidden { display: none !important; }
        .legend { display: flex; flex-wrap: wrap; gap: 0.5rem; font-size: 0.7rem; margin: 0.75rem 0; }
        .legend span { padding: 0.25rem 0.6rem; border-radius: 999px; border: 1px solid; }
        .leg-ok { background: rgba(34,197,94,.15); border-color: rgba(34,197,94,.4); color: #86efac; }
        .leg-review { background: rgba(234,179,8,.15); border-color: rgba(234,179,8,.4); color: #fde047; }
        .leg-absent { background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.4); color: #fca5a5; }
        .row-ok { background: rgba(34,197,94,.08); border-color: rgba(34,197,94,.35); color: #bbf7d0; }
        .row-review { background: rgba(234,179,8,.08); border-color: rgba(234,179,8,.4); color: #fef08a; }
        .row-absent { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.35); color: #fecaca; }
        .person-row {
            display: flex; flex-direction: column; gap: 0.35rem;
            padding: 0.75rem; border-radius: 0.75rem; border: 1px solid; margin-bottom: 0.35rem;
        }
        .person-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
        .person-meta { font-size: 0.65rem; opacity: 0.85; line-height: 1.4; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; text-align: center; }
        .stat-box { padding: 1rem; border-radius: 0.75rem; background: #1e293b; border-bottom: 3px solid; }
        .img-tile { text-align: center; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid; font-size: 0.7rem; }
        pre#debugText { max-height: 12rem; overflow: auto; font-size: 0.68rem; white-space: pre-wrap; color: #cbd5e1; }
        .filter-bar { display: grid; gap: 0.75rem; margin-bottom: 0.75rem; }
        @media (min-width: 640px) { .filter-bar { grid-template-columns: 1fr 1fr; } }
        .filter-bar label { font-size: 0.65rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 0.35rem; }
        .filter-bar select, .filter-bar input {
            width: 100%; padding: 0.55rem 0.75rem; border-radius: 0.5rem;
            border: 1px solid #475569; background: #0f172a; color: #f1f5f9; font-size: 0.85rem;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div class="wrap space-y-4">

    <div class="card hero">
        <div style="font-size:2rem">🚢</div>
        <h1>POB MUSTER CHECKER</h1>
        <p>Kamala Thanee · 180 คน · Google AI Studio</p>
    </div>

    <div class="grid2">
        <div class="card">
            <label class="lbl lbl-excel" for="excelInput">1. ไฟล์รายชื่อ (Excel)</label>
            <input type="file" id="excelInput" accept=".xlsx">
            <div id="excelInfo" style="margin-top:0.5rem;font-size:0.75rem;color:#93c5fd"></div>
        </div>
        <div class="card">
            <label class="lbl lbl-img" for="imageInput">2. รูปบอร์ด (เลือกหลายรูปได้)</label>
            <input type="file" id="imageInput" accept="image/*" multiple>
            <div id="imageFileList" style="margin-top:0.5rem;font-size:0.7rem;color:#86efac"></div>
        </div>
    </div>

    <button type="button" onclick="processImages()" id="mainBtn">เริ่มการตรวจเช็ก</button>

    <div class="legend hidden" id="legendBox">
        <span class="leg-ok">✅ เจอตรง (ห้อง+เตียง+ชื่อ)</span>
        <span class="leg-review">⚠️ ตรวจสอบ — ห้องหรือชื่อไม่ตรง</span>
        <span class="leg-absent">❌ ไม่พบในรูปเลย</span>
    </div>

    <div id="imageSummary" class="hidden card">
        <div style="font-size:0.65rem;font-weight:700;color:#60a5fa;text-transform:uppercase">จำนวนชื่อที่อ่านได้ต่อรูป (ชื่อไฟล์)</div>
        <div id="imageSummaryRows" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:0.5rem;margin-top:0.75rem"></div>
        <div id="imageSummaryTotal" style="margin-top:0.75rem;padding-top:0.5rem;border-top:1px solid #334155;font-size:0.75rem;color:#94a3b8;font-weight:600"></div>
    </div>

    <div id="modelStatus" class="hidden card">
        <div style="font-size:0.65rem;font-weight:700;color:#94a3b8;text-transform:uppercase">AI Model ที่ใช้งาน</div>
        <div id="modelRows" style="margin-top:0.5rem"></div>
    </div>

    <div id="dashboard" class="hidden">
        <div class="stat-grid" style="margin-bottom:0.75rem">
            <div class="stat-box" style="border-color:#3b82f6">
                <div style="font-size:0.6rem;color:#94a3b8">MARINE</div>
                <div id="c-marine" style="font-size:1.1rem;font-weight:800">0/0</div>
            </div>
            <div class="stat-box" style="border-color:#a855f7">
                <div style="font-size:0.6rem;color:#94a3b8">CATERING</div>
                <div id="c-catering" style="font-size:1.1rem;font-weight:800">0/0</div>
            </div>
            <div class="stat-box" style="border-color:#f97316">
                <div style="font-size:0.6rem;color:#94a3b8">PASSENGER</div>
                <div id="c-pax" style="font-size:1.1rem;font-weight:800">0/0</div>
            </div>
        </div>
        <div class="card" style="text-align:center;font-size:0.85rem;font-weight:700" id="totalSummary"></div>
    </div>
    <div id="filterBar" class="hidden card filter-bar">
        <div>
            <label for="filterCabin">กรองเลขห้อง</label>
            <select id="filterCabin"><option value="ALL">ทุกห้อง</option></select>
        </div>
        <div>
            <label for="filterName">ค้นหาชื่อ</label>
            <input type="text" id="filterName" placeholder="พิมพ์ชื่อ เช่น TANAWAT">
        </div>
        <div id="filterResultHint" style="grid-column:1/-1;font-size:0.7rem;color:#94a3b8;min-height:1em"></div>
    </div>

    <div id="debugBox" class="hidden card" style="border-color:#a16207">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">
            <span style="font-weight:700;color:#fbbf24;font-size:0.75rem">🔍 Raw OCR (debug)</span>
            <span id="ocrCount" style="font-size:0.7rem;color:#94a3b8"></span>
        </div>
        <pre id="debugText"></pre>
    </div>

    <div id="results"></div>
</div>

<script>
let pobData = { marine: [], catering: [], passenger: [] };
let ocrResults = [];
let modelLog = [];
let xlsxPromise = null;

function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function loadXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxPromise) {
        xlsxPromise = new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
            s.onload = () => resolve(window.XLSX);
            s.onerror = reject;
            document.head.appendChild(s);
        });
    }
    return xlsxPromise;
}

document.getElementById('imageInput').onchange = (e) => {
    const names = Array.from(e.target.files).map(f => f.name);
    const el = document.getElementById('imageFileList');
    el.textContent = names.length ? `📷 ${names.length} รูป: ${names.slice(0, 4).join(', ')}${names.length > 4 ? '…' : ''}` : '';
};

document.getElementById('excelInput').onchange = async (e) => {
    const XLSX = await loadXLSX();
    const buf = await e.target.files[0].arrayBuffer();
    const wb = XLSX.read(buf);
    const ws = wb.Sheets['POB'];
    if (!ws) return alert('ไม่พบ Sheet ชื่อ "POB"');

    const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
    pobData = { marine: [], catering: [], passenger: [] };

    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const colA = String(row[0] || '').trim();
        const colB = String(row[1] || '').trim();
        const colC = String(row[2] || '').trim();
        const colD = String(row[3] || '').trim().toUpperCase();
        const colG = String(row[6] || '').trim().toUpperCase();

        if (colD.includes('HOT BED') || colD.includes('ONE DAY') || colA === 'SUMMARY') break;
        if (!/^\d+$/.test(colA)) continue;
        if (!colB || !colC || !colD) continue;
        if (['NAME','BARGE CREW','CATERING','PASSENGER','SECTION'].includes(colD)) continue;

        const cabinId  = colB.toUpperCase().replace(/\s/g, '');
        const bed      = colC.toUpperCase();
        const cabinBed = cabinId + bed;

        let sec;
        if (colG === 'MARINE CREW')        sec = 'marine';
        else if (colG === 'CATERING CREW') sec = 'catering';
        else                               sec = 'passenger';

        pobData[sec].push({
            cabin: cabinId, bed, cabinBed, name: colD,
            matchStatus: 'absent', sourceFile: null, reviewReason: null, ocrCabin: null, ocrName: null
        });
    }

    const t = pobData.marine.length + pobData.catering.length + pobData.passenger.length;
    document.getElementById('excelInfo').innerText =
        `✅ Marine ${pobData.marine.length} · Catering ${pobData.catering.length} · Passenger ${pobData.passenger.length} · รวม ${t} คน`;
};

async function resizeImage(file, maxWidth = 1500) {
    return new Promise(resolve => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width  = img.width  * scale;
            canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(
                blob => resolve(new File([blob], file.name, { type: 'image/jpeg' })),
                'image/jpeg', 0.85
            );
            URL.revokeObjectURL(url);
        };
        img.src = url;
    });
}

const OCR_CONCURRENCY = 2;

async function scanOneImage(file) {
    const resized = await resizeImage(file);
    const fd = new FormData();
    fd.append('files', resized);
    const fileName = file.name;
    try {
        const res  = await fetch('/api/read-image', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.error) {
            return {
                fileName, tagCount: 0, error: data.error,
                raw: `❌ ${fileName} ERROR: ${data.error}`,
                model: '❌ Error', parsed: [],
            };
        }
        const parsed = (data.parsed || []).map(t => ({ ...t, sourceFile: fileName }));
        return {
            fileName, parsed, tagCount: parsed.length,
            raw: data.raw ? `--- ${fileName} ---\n${data.raw}` : '',
            model: data.model_used || 'Unknown',
        };
    } catch (err) {
        return {
            fileName, tagCount: 0, parsed: [],
            raw: `❌ ${fileName} FETCH ERROR: ${err}`,
            model: '❌ Fetch Error',
        };
    }
}

async function runWithConcurrency(items, limit, fn, onProgress) {
    const results = new Array(items.length);
    let next = 0, done = 0;
    async function worker() {
        while (next < items.length) {
            const i = next++;
            results[i] = await fn(items[i], i);
            done++;
            onProgress(done, items.length);
        }
    }
    await Promise.all(Array.from({ length: Math.min(limit, items.length) }, () => worker()));
    return results;
}

async function processImages() {
    const files = Array.from(document.getElementById('imageInput').files);
    if (!files.length) return alert('กรุณาเลือกรูปภาพ');
    const total = pobData.marine.length + pobData.catering.length + pobData.passenger.length;
    if (!total) return alert('กรุณาโหลดไฟล์ Excel ก่อน');

    const btn = document.getElementById('mainBtn');
    btn.disabled = true;
    ocrResults = [];
    modelLog = [];
    let allRaw = [];

    const scanResults = await runWithConcurrency(
        files, OCR_CONCURRENCY,
        (file) => scanOneImage(file),
        (done, count) => { btn.innerText = `⏳ สแกน ${done}/${count} รูป...`; }
    );

    const imageStats = [];
    for (const r of scanResults) {
        if (r.raw) allRaw.push(r.raw);
        imageStats.push({
            fileName: r.fileName,
            count: r.tagCount ?? 0,
            model: r.model || '❌ Error',
            error: r.error,
        });
        modelLog.push({
            fileName: r.fileName,
            model: r.model || '❌ Error',
            tagCount: r.tagCount ?? 0,
            error: r.error,
        });
        if (r.parsed?.length) ocrResults = ocrResults.concat(r.parsed);
    }

    document.getElementById('legendBox').classList.remove('hidden');
    renderImageSummary(imageStats);
    renderModelStatus();
    document.getElementById('debugBox').classList.remove('hidden');
    document.getElementById('ocrCount').innerText =
        `รวม ${ocrResults.length} ชื่อ · ` + imageStats.map(s => `${s.fileName}:${s.count}`).join(' · ');
    document.getElementById('debugText').textContent = allRaw.join('\n\n');

    matchAndShow();
    btn.disabled = false;
    btn.innerText = 'เริ่มการตรวจเช็กอีกครั้ง';
}

function renderImageSummary(imageStats) {
    const box = document.getElementById('imageSummary');
    if (!imageStats.length) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    const total = imageStats.reduce((s, x) => s + x.count, 0);
    let html = '';
    for (const s of imageStats) {
        const cls = s.error ? 'row-absent' : s.count > 0 ? 'row-ok' : 'row-review';
        html += `<div class="img-tile ${cls}" title="${esc(s.fileName)}">
            <div style="font-size:0.6rem;opacity:.7;word-break:break-all;max-height:2.5em;overflow:hidden">${esc(s.fileName)}</div>
            <div style="font-size:1.25rem;font-weight:900">${s.error ? '❌' : s.count}</div>
            <div style="opacity:.7">${s.error ? 'error' : 'ชื่อ'}</div>
        </div>`;
    }
    document.getElementById('imageSummaryRows').innerHTML = html;
    document.getElementById('imageSummaryTotal').innerText =
        `รวมทุกรูป: ${total} ชื่อ จาก ${imageStats.length} ไฟล์`;
}

function renderModelStatus() {
    const box = document.getElementById('modelStatus');
    box.classList.remove('hidden');
    let html = '';
    for (const entry of modelLog) {
        html += `<div style="display:flex;justify-content:space-between;gap:0.5rem;padding:0.4rem 0;border-bottom:1px solid #334155;font-size:0.7rem">
            <span style="color:#93c5fd;max-width:35%;word-break:break-all">${esc(entry.fileName)}</span>
            <span style="font-weight:700">${entry.tagCount} ชื่อ</span>
            <span style="opacity:.8;truncate">${esc(entry.model)}</span>
        </div>`;
    }
    document.getElementById('modelRows').innerHTML = html;
}

function normalizeKey(s) {
    return String(s || '').toUpperCase().replace(/[\s-]/g, '');
}

function parseCabinParts(cabinBed) {
    const n = normalizeKey(cabinBed);
    const m = n.match(/^([A-Z])(\d+)([A-D])$/);
    if (m) return { letter: m[1], num: m[2], bed: m[3], base: m[1] + m[2], full: n };
    return { letter: '', num: '', bed: '', base: n, full: n };
}

function nameSimilarity(excelName, ocrName) {
    const a = String(excelName || '').split(/\s+/).filter(Boolean);
    const b = String(ocrName || '').split(/\s+/).filter(Boolean);
    if (!a.length || !b.length) return 0;
    const firstMatch = a[0] === b[0] || b[0].startsWith(a[0]) || a[0].startsWith(b[0]);
    if (!firstMatch) return 0;
    if (a.length >= 2 && b.length >= 2) {
        const la = a[a.length - 1], lb = b[b.length - 1];
        if (la === lb || lb.startsWith(la) || la.startsWith(lb)) return 1;
        return 0.65;
    }
    return 0.55;
}

const NAME_MATCH_MIN = 0.55;

function classifyPerson(p) {
    const pKey = normalizeKey(p.cabinBed);
    const pParts = parseCabinParts(p.cabinBed);

    // ✅ ห้อง + เตียง + ชื่อ ตรง
    for (const o of ocrResults) {
        if (normalizeKey(o.cabin_bed) === pKey && nameSimilarity(p.name, o.name_tag) >= NAME_MATCH_MIN) {
            return { status: 'ok', o, reason: null };
        }
    }

    // ⚠️ ห้อง+เตียงตรง แต่ชื่อในรูปเป็นคนอื่น (เช่น B434C เป็น TANAWAT แต่ POB เป็น THITIPOOM)
    for (const o of ocrResults) {
        if (normalizeKey(o.cabin_bed) === pKey) {
            return {
                status: 'review',
                o,
                reason: `ห้อง+เตียงตรงแต่ชื่อในรูปไม่ตรง: ในรูป "${o.name_tag || '?'}" · POB "${p.name}"`,
            };
        }
    }

    // ⚠️ ชื่อตรง แต่เตียง/ห้องในรูปต่าง (เช่น POB B434B TANAWAT แต่รูป B434C TANAWAT)
    let bestBed = null;
    let bestBedScore = 0;
    for (const o of ocrResults) {
        const oParts = parseCabinParts(o.cabin_bed);
        const nameSim = nameSimilarity(p.name, o.name_tag);
        if (pParts.base && pParts.base === oParts.base && pParts.bed !== oParts.bed && nameSim >= NAME_MATCH_MIN) {
            if (nameSim > bestBedScore) {
                bestBedScore = nameSim;
                bestBed = {
                    o,
                    reason: `เตียงไม่ตรง (ชื่อตรง): ในรูป ${o.cabin_bed} "${o.name_tag}" · POB ${p.cabinBed} "${p.name}"`,
                };
            }
        }
    }
    if (bestBed) return { status: 'review', o: bestBed.o, reason: bestBed.reason };

    // ⚠️ ชื่อเจอในห้องอื่น
    let bestElsewhere = null;
    let bestElseScore = 0;
    for (const o of ocrResults) {
        if (normalizeKey(o.cabin_bed) === pKey) continue;
        const nameSim = nameSimilarity(p.name, o.name_tag);
        if (nameSim >= NAME_MATCH_MIN && nameSim > bestElseScore) {
            bestElseScore = nameSim;
            bestElsewhere = {
                o,
                reason: `ชื่อเจอในห้องอื่น: ในรูป ${o.cabin_bed} "${o.name_tag}" · POB ${p.cabinBed} "${p.name}"`,
            };
        }
    }
    if (bestElsewhere) return { status: 'review', o: bestElsewhere.o, reason: bestElsewhere.reason };

    // ❌ ไม่มีในรูป
    return { status: 'absent', o: null, reason: null };
}

function matchAndShow() {
    for (const sec of Object.keys(pobData)) {
        for (const p of pobData[sec]) {
            const r = classifyPerson(p);
            p.matchStatus = r.status;
            p.sourceFile = r.o?.sourceFile ?? null;
            p.reviewReason = r.reason;
            p.ocrCabin = r.o?.cabin_bed ?? null;
            p.ocrName = r.o?.name_tag ?? null;
        }
    }
    populateCabinFilter();
    renderUI();
}

function populateCabinFilter() {
    const bases = new Set();
    for (const sec of Object.keys(pobData)) {
        for (const p of pobData[sec]) {
            const parts = parseCabinParts(p.cabinBed);
            if (parts.base) bases.add(parts.base);
        }
    }
    const sel = document.getElementById('filterCabin');
    const cur = sel.value;
    sel.innerHTML = '<option value="ALL">ทุกห้อง</option>' +
        [...bases].sort().map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('');
    sel.value = [...bases, 'ALL'].includes(cur) ? cur : 'ALL';
}

function personPassesFilter(p) {
    const cabin = document.getElementById('filterCabin').value;
    const nameQ = document.getElementById('filterName').value.trim().toUpperCase();
    if (cabin !== 'ALL') {
        const base = parseCabinParts(p.cabinBed).base;
        if (base !== cabin) return false;
    }
    if (nameQ && !String(p.name || '').toUpperCase().includes(nameQ)) return false;
    return true;
}

function sectionCounts(arr) {
    return {
        ok: arr.filter(x => x.matchStatus === 'ok').length,
        review: arr.filter(x => x.matchStatus === 'review').length,
        absent: arr.filter(x => x.matchStatus === 'absent').length,
    };
}

function renderPersonRow(p) {
    const status = p.matchStatus;
    const cls = status === 'ok' ? 'row-ok' : status === 'review' ? 'row-review' : 'row-absent';
    const icon = status === 'ok' ? '✅' : status === 'review' ? '⚠️' : '❌';
    let meta = '';
    if (status === 'review') {
        meta = `<div class="person-meta">
            <div>${esc(p.reviewReason)}</div>
            <div style="color:#fbbf24">↳ ดูรูป: <b>${esc(p.sourceFile)}</b></div>
        </div>`;
    } else if (status === 'ok' && p.sourceFile) {
        meta = `<div class="person-meta">↳ พบในรูป: <b>${esc(p.sourceFile)}</b></div>`;
    }
    return `<div class="person-row ${cls}">
        <div class="person-top">
            <span style="font-size:0.875rem"><b>${esc(p.cabinBed)}</b> ${esc(p.name)}</span>
            <span style="font-size:1.25rem">${icon}</span>
        </div>
        ${meta}
    </div>`;
}

document.getElementById('filterCabin').addEventListener('change', () => renderUI());
document.getElementById('filterName').addEventListener('input', () => renderUI());

function renderUI() {
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('filterBar').classList.remove('hidden');

    function fmtCounts(arr, elId) {
        const c = sectionCounts(arr);
        document.getElementById(elId).innerHTML =
            `<span style="color:#86efac">${c.ok}</span>/<span>${arr.length}</span>` +
            (c.review ? ` <span style="color:#fde047;font-size:0.65rem">⚠${c.review}</span>` : '');
    }
    fmtCounts(pobData.marine, 'c-marine');
    fmtCounts(pobData.catering, 'c-catering');
    fmtCounts(pobData.passenger, 'c-pax');

    const all = [...pobData.marine, ...pobData.catering, ...pobData.passenger];
    const tc = sectionCounts(all);
    document.getElementById('totalSummary').innerHTML =
        `✅ เจอตรง <span style="color:#86efac">${tc.ok}</span> · ` +
        `⚠️ ตรวจสอบ <span style="color:#fde047">${tc.review}</span> · ` +
        `❌ ไม่พบ <span style="color:#fca5a5">${tc.absent}</span> · รวม ${all.length} คน`;

    const sections = [
        { key: 'marine', label: 'MARINE CREW' },
        { key: 'catering', label: 'CATERING CREW' },
        { key: 'passenger', label: 'PASSENGER / OPERATION' },
    ];

    const order = { review: 0, absent: 1, ok: 2 };
    let html = '';
    let shownTotal = 0;
    for (const { key, label } of sections) {
        const list = [...pobData[key]]
            .filter(personPassesFilter)
            .sort((a, b) => order[a.matchStatus] - order[b.matchStatus]);
        if (!list.length) continue;
        shownTotal += list.length;
        const c = sectionCounts(list);
        html += `<div style="font-size:0.7rem;font-weight:700;color:#94a3b8;margin:1.25rem 0 0.5rem;text-transform:uppercase">
            ${label} — ✅ ${c.ok} · ⚠️ ${c.review} · ❌ ${c.absent}
            <span style="opacity:.6;font-weight:400"> (แสดง ${list.length})</span>
        </div>`;
        for (const p of list) html += renderPersonRow(p);
    }
    if (!html) {
        html = '<div style="text-align:center;color:#94a3b8;padding:1.5rem">ไม่พบรายชื่อตามตัวกรอง</div>';
    }
    document.getElementById('results').innerHTML = html;
    const hint = document.getElementById('filterResultHint');
    if (hint) {
        hint.textContent = (shownTotal < all.length && (document.getElementById('filterCabin').value !== 'ALL' || document.getElementById('filterName').value.trim()))
            ? `แสดง ${shownTotal} จาก ${all.length} คน` : '';
    }
}
</script>
</body>
</html>
