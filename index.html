<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POB Checker - Kamala Thanee</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 45%, #0f172a 100%);
            color: #f1f5f9;
        }
        .wrap { max-width: 56rem; margin: 0 auto; padding: 1rem; }
        .card {
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid #334155;
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        .hero { text-align: center; }
        .hero h1 { font-size: 1.6rem; font-weight: 900; color: #60a5fa; margin: 0.2rem 0; }
        .hero p { color: #94a3b8; font-size: 0.85rem; margin: 0; }
        .grid2 { display: grid; gap: 0.75rem; }
        @media (min-width: 768px) { .grid2 { grid-template-columns: 1fr 1fr; } }
        label.lbl { display: block; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.4rem; }
        .lbl-excel { color: #93c5fd; }
        .lbl-img { color: #86efac; }
        input[type=file] {
            width: 100%; font-size: 0.8rem; padding: 0.55rem;
            border-radius: 0.6rem; border: 1px dashed #475569;
            background: #0f172a; color: #e2e8f0;
        }
        #mainBtn {
            width: 100%; padding: 1rem; font-size: 1.05rem; font-weight: 800;
            border: none; border-radius: 0.85rem; cursor: pointer;
            background: linear-gradient(135deg, #2563eb, #3b82f6); color: white;
        }
        #mainBtn:disabled { opacity: 0.6; cursor: wait; }
        .hidden { display: none !important; }
        .legend { display: flex; flex-wrap: wrap; gap: 0.4rem; font-size: 0.68rem; }
        .legend span { padding: 0.2rem 0.5rem; border-radius: 999px; border: 1px solid; }
        .leg-ok { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.4); color: #86efac; }
        .leg-review { background: rgba(234,179,8,.12); border-color: rgba(234,179,8,.4); color: #fde047; }
        .leg-absent { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.4); color: #fca5a5; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; text-align: center; }
        .stat-box {
            padding: 0.85rem 0.4rem; border-radius: 0.65rem;
            background: #1e293b; cursor: pointer; border: 1px solid #334155;
        }
        .stat-box:hover { border-color: #64748b; }
        .stat-box.active { outline: 2px solid #60a5fa; }
        .stat-box .t { font-size: 0.58rem; color: #94a3b8; margin-bottom: 0.2rem; }
        .stat-box .n { font-size: 1.1rem; font-weight: 800; }
        .dash-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.75rem; }
        .dash-pill {
            text-align: center; padding: 0.7rem 0.3rem; border-radius: 0.65rem;
            cursor: pointer; background: #1e293b; border: 1px solid #475569;
        }
        .dash-pill:hover { border-color: #94a3b8; }
        .dash-pill.active { outline: 2px solid #fff; }
        .dash-pill .num { font-size: 1.4rem; font-weight: 900; }
        .dash-pill .lbl { font-size: 0.58rem; color: #94a3b8; margin-top: 0.15rem; }
        .pill-ok { border-bottom: 3px solid #22c55e; }
        .pill-review { border-bottom: 3px solid #eab308; }
        .pill-absent { border-bottom: 3px solid #ef4444; }
        .filter-bar { display: grid; gap: 0.6rem; }
        @media (min-width: 640px) { .filter-bar { grid-template-columns: 1fr 1fr auto; align-items: end; } }
        .filter-bar label { font-size: 0.62rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 0.3rem; }
        .filter-bar input {
            width: 100%; padding: 0.5rem; border-radius: 0.45rem;
            border: 1px solid #475569; background: #0f172a; color: #f1f5f9;
        }
        .btn-clear {
            padding: 0.5rem 0.75rem; border-radius: 0.45rem; border: 1px solid #475569;
            background: #0f172a; color: #94a3b8; cursor: pointer; font-size: 0.75rem; white-space: nowrap;
        }
        .filter-active { font-size: 0.7rem; color: #93c5fd; margin-top: 0.35rem; }
        .row-ok { background: rgba(34,197,94,.08); border-color: rgba(34,197,94,.35); color: #bbf7d0; }
        .row-review { background: rgba(234,179,8,.08); border-color: rgba(234,179,8,.4); color: #fef08a; }
        .row-absent { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.35); color: #fecaca; }
        .person-row {
            display: flex; flex-direction: column; gap: 0.3rem;
            padding: 0.7rem; border-radius: 0.7rem; border: 1px solid; margin-bottom: 0.35rem;
        }
        .person-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
        .person-meta { font-size: 0.65rem; opacity: 0.9; line-height: 1.4; }
        .btn-row { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.25rem; }
        .btn-sm {
            font-size: 0.62rem; padding: 0.25rem 0.5rem; border-radius: 0.35rem;
            border: 1px solid #475569; background: #0f172a; color: #e2e8f0; cursor: pointer;
        }
        .btn-sm.active { background: #2563eb; border-color: #3b82f6; }
        .sec-hdr { font-size: 0.68rem; font-weight: 700; color: #94a3b8; margin: 1rem 0 0.4rem; text-transform: uppercase; }
        .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(5rem, 1fr)); gap: 0.3rem; margin-top: 0.5rem; }
        .img-chip { font-size: 0.6rem; padding: 0.3rem; border-radius: 0.35rem; border: 1px solid #334155; text-align: center; background: #0f172a; }
        .img-chip b { display: block; font-size: 0.95rem; color: #93c5fd; }
        details summary { cursor: pointer; font-size: 0.7rem; color: #94a3b8; font-weight: 600; }
        pre#debugText { max-height: 10rem; overflow: auto; font-size: 0.65rem; white-space: pre-wrap; color: #cbd5e1; }
    </style>
</head>
<body>
<div class="wrap">

    <div class="card hero">
        <div style="font-size:1.75rem">🚢</div>
        <h1>POB MUSTER CHECKER</h1>
        <p>Kamala Thanee · Google AI Studio</p>
    </div>

    <div class="grid2">
        <div class="card" style="margin:0">
            <label class="lbl lbl-excel" for="excelInput">1. ไฟล์รายชื่อ (Excel)</label>
            <input type="file" id="excelInput" accept=".xlsx">
            <div id="excelInfo" style="margin-top:0.4rem;font-size:0.72rem;color:#93c5fd"></div>
        </div>
        <div class="card" style="margin:0">
            <label class="lbl lbl-img" for="imageInput">2. รูปบอร์ด</label>
            <input type="file" id="imageInput" accept="image/*" multiple>
            <div id="imageFileList" style="margin-top:0.4rem;font-size:0.68rem;color:#86efac"></div>
        </div>
    </div>

    <button type="button" onclick="processImages()" id="mainBtn">เริ่มการตรวจเช็ก</button>

    <div id="resultsPanel" class="hidden">

        <div class="legend" style="margin-bottom:0.75rem">
            <span class="leg-ok">✅ ห้อง+เตียง+ชื่อตรง</span>
            <span class="leg-review">⚠️ ตรวจสอบ</span>
            <span class="leg-absent">❌ ไม่พบในรูป</span>
        </div>

        <!-- กดกรองรายชื่อด้านล่าง (หน้าเดียว) -->
        <div class="dash-row">
            <div class="dash-pill pill-ok" id="pillOk" onclick="setStatusFilter('ok')">
                <div class="num" id="nOk">0</div>
                <div class="lbl">✅ เจอตรง</div>
            </div>
            <div class="dash-pill pill-review" id="pillReview" onclick="setStatusFilter('review')">
                <div class="num" id="nReview">0</div>
                <div class="lbl">⚠️ ตรวจสอบ</div>
            </div>
            <div class="dash-pill pill-absent" id="pillAbsent" onclick="setStatusFilter('absent')">
                <div class="num" id="nAbsent">0</div>
                <div class="lbl">❌ ไม่พบ</div>
            </div>
        </div>

        <div class="stat-grid" style="margin-bottom:0.75rem">
            <div class="stat-box" id="boxMarine" onclick="setSectionFilter('marine')" style="border-bottom:3px solid #3b82f6">
                <div class="t">MARINE</div>
                <div class="n" id="c-marine">0/0</div>
            </div>
            <div class="stat-box" id="boxCatering" onclick="setSectionFilter('catering')" style="border-bottom:3px solid #a855f7">
                <div class="t">CATERING</div>
                <div class="n" id="c-catering">0/0</div>
            </div>
            <div class="stat-box" id="boxPassenger" onclick="setSectionFilter('passenger')" style="border-bottom:3px solid #f97316">
                <div class="t">PASSENGER</div>
                <div class="n" id="c-pax">0/0</div>
            </div>
        </div>

        <div class="card" id="totalSummary" style="text-align:center;font-size:0.82rem;font-weight:700;margin-bottom:0.75rem"></div>

        <div class="card filter-bar">
            <div>
                <label for="filterCabin">ห้อง / เตียง</label>
                <input type="text" id="filterCabin" list="cabinDatalist" placeholder="พิมพ์ B434 หรือ B434C">
                <datalist id="cabinDatalist"></datalist>
            </div>
            <div>
                <label for="filterName">ค้นหาชื่อ</label>
                <input type="text" id="filterName" placeholder="พิมพ์ชื่อ">
            </div>
            <div>
                <button type="button" class="btn-clear" onclick="clearFilters()">ล้างตัวกรอง</button>
            </div>
            <div id="filterActiveLabel" class="filter-active" style="grid-column:1/-1"></div>
        </div>

        <details class="card">
            <summary>📷 สรุปรูป (<span id="imgScanCount">0</span> ไฟล์ · <span id="imgTagTotal">0</span> ชื่อ)</summary>
            <div id="imageSummaryRows" class="img-grid"></div>
        </details>

        <details class="card hidden" id="duplicateTagPanel" open>
            <summary id="duplicateTagSummary">⚠️ ไม่พบป้ายซ้ำ</summary>
            <div id="duplicateTagRows" style="margin-top:0.65rem"></div>
        </details>

        <details class="card">
            <summary>🔍 Raw OCR (debug)</summary>
            <pre id="debugText"></pre>
        </details>

        <div id="results" style="margin-top:0.5rem"></div>
    </div>
</div>

<script>
let pobData = { marine: [], catering: [], passenger: [] };
let ocrResults = [];
let xlsxPromise = null;
let filterStatus = null;
let filterSection = null;
let matchingDiagnostics = {
    logicalOcrCount: 0,
    unassignedOcr: [],
    duplicateOcr: [],
    extraDuplicateCount: 0,
};

const SECTIONS = [
    { key: 'marine', label: 'MARINE CREW' },
    { key: 'catering', label: 'CATERING CREW' },
    { key: 'passenger', label: 'PASSENGER / OPERATION' },
];

function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function loadXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxPromise) {
        xlsxPromise = new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
            s.onload = () => resolve(window.XLSX);
            s.onerror = reject;
            document.head.appendChild(s);
        });
    }
    return xlsxPromise;
}

function allPeople() {
    return [...pobData.marine, ...pobData.catering, ...pobData.passenger];
}

document.getElementById('imageInput').onchange = (e) => {
    const n = e.target.files.length;
    document.getElementById('imageFileList').textContent = n ? `📷 เลือก ${n} รูป` : '';
};

document.getElementById('excelInput').onchange = async (e) => {
    const XLSX = await loadXLSX();
    const ws = XLSX.read(await e.target.files[0].arrayBuffer()).Sheets['POB'];
    if (!ws) return alert('ไม่พบ Sheet "POB"');
    pobData = { marine: [], catering: [], passenger: [] };
    for (const row of XLSX.utils.sheet_to_json(ws, { header: 1 })) {
        const colA = String(row[0]||'').trim(), colB = String(row[1]||'').trim();
        const colC = String(row[2]||'').trim(), colD = String(row[3]||'').trim().toUpperCase();
        const colG = String(row[6]||'').trim().toUpperCase();
        if (colD.includes('HOT BED') || colD.includes('ONE DAY') || colA === 'SUMMARY') break;
        if (!/^\d+$/.test(colA) || !colB || !colC || !colD) continue;
        if (['NAME','BARGE CREW','CATERING','PASSENGER','SECTION'].includes(colD)) continue;
        const cabinId = colB.toUpperCase().replace(/\s/g,'');
        const bed = colC.toUpperCase();
        let sec = colG === 'MARINE CREW' ? 'marine' : colG === 'CATERING CREW' ? 'catering' : 'passenger';
        pobData[sec].push({
            cabin: cabinId, bed, cabinBed: cabinId + bed, name: colD,
            matchStatus: 'absent', userOverride: null,
            sourceFile: null, reviewReason: null, ocrCabin: null, ocrName: null,
            matchReasonCode: null, assignedOcrId: null, matchEvidence: null,
        });
    }
    const t = allPeople().length;
    document.getElementById('excelInfo').textContent =
        `โหลด ${t} คน (M${pobData.marine.length} · C${pobData.catering.length} · P${pobData.passenger.length})`;
};

async function resizeImage(file, maxW = 1500) {
    return new Promise(resolve => {
        const img = new Image(), url = URL.createObjectURL(file);
        img.onload = () => {
            const s = Math.min(1, maxW / img.width);
            const c = document.createElement('canvas');
            c.width = img.width * s; c.height = img.height * s;
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            c.toBlob(b => resolve(new File([b], file.name, { type: 'image/jpeg' })), 'image/jpeg', 0.85);
            URL.revokeObjectURL(url);
        };
        img.src = url;
    });
}

async function scanOneImage(file) {
    const fd = new FormData();
    fd.append('files', await resizeImage(file));
    const fileName = file.name;
    try {
        const data = await (await fetch('/api/read-image', { method: 'POST', body: fd })).json();
        if (data.error) return { fileName, tagCount: 0, parsed: [], raw: `❌ ${fileName}: ${data.error}`, model: '' };
        const parsed = (data.parsed || []).map(t => ({ ...t, sourceFile: fileName }));
        return { fileName, parsed, tagCount: parsed.length,
            raw: data.raw ? `--- ${fileName} ---\n${data.raw}` : '', model: data.model_used || '' };
    } catch (err) {
        return { fileName, tagCount: 0, parsed: [], raw: `❌ ${fileName}: ${err}`, model: '' };
    }
}

async function processImages() {
    const files = [...document.getElementById('imageInput').files];
    if (!files.length) return alert('เลือกรูปก่อน');
    if (!allPeople().length) return alert('โหลด Excel ก่อน');
    const btn = document.getElementById('mainBtn');
    btn.disabled = true;
    ocrResults = [];
    const stats = [];
    let done = 0, qi = 0;
    async function w() {
        while (qi < files.length) {
            const i = qi++;
            const r = await scanOneImage(files[i]);
            stats.push(r);
            if (r.parsed?.length) ocrResults.push(...r.parsed);
            btn.textContent = `⏳ ${++done}/${files.length}`;
        }
    }
    await Promise.all([w(), w()]);
    allPeople().forEach(p => { p.userOverride = null; });
    filterStatus = null; filterSection = null;
    const successfulImages = stats.filter(s => Boolean(s.model)).length;
    matchAll({
        totalImages: stats.length,
        successfulImages,
        failedImages: stats.length - successfulImages,
    });
    document.getElementById('debugText').textContent = stats.map(s => s.raw).filter(Boolean).join('\n\n');
    renderImageChips(stats);
    document.getElementById('resultsPanel').classList.remove('hidden');
    renderUI();
    btn.disabled = false;
    btn.textContent = 'เริ่มการตรวจเช็กอีกครั้ง';
    document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function normalizeKey(s) { return String(s||'').toUpperCase().replace(/[\s-]/g,''); }
function parseCabinParts(cb) {
    const n = normalizeKey(cb);
    const m = n.match(/^([A-Z])(\d+)([A-D])$/);
    return m ? { base: m[1]+m[2], bed: m[3], full: n } : { base: n, bed: '', full: n };
}
function normalizeName(s) {
    return String(s || '').toUpperCase().trim().replace(/\s+/g, ' ');
}
function isOneEditApart(a, b) {
    if (a === b || Math.abs(a.length - b.length) > 1 || Math.min(a.length, b.length) < 5) return false;
    let i = 0, j = 0, edits = 0;
    while (i < a.length && j < b.length) {
        if (a[i] === b[j]) { i++; j++; continue; }
        if (++edits > 1) return false;
        if (a.length > b.length) i++;
        else if (b.length > a.length) j++;
        else { i++; j++; }
    }
    if (i < a.length || j < b.length) edits++;
    return edits === 1;
}
function surnameCompatible(a, b) {
    if (!a || !b) return false;
    const shorter = a.length <= b.length ? a : b;
    const longer = a.length <= b.length ? b : a;
    return shorter.length >= 2 && longer.startsWith(shorter);
}
function compareNames(a, b) {
    const left = normalizeName(a), right = normalizeName(b);
    const x = left.split(' ').filter(Boolean), y = right.split(' ').filter(Boolean);
    if (!x.length || !y.length) return 'none';
    if (left === right) return 'exact';

    const firstExact = x[0] === y[0];
    const xLast = x.length > 1 ? x[x.length - 1] : '';
    const yLast = y.length > 1 ? y[y.length - 1] : '';
    const surnameStrong = surnameCompatible(xLast, yLast);
    if (firstExact && surnameStrong) return 'abbreviation';

    const firstTypo = isOneEditApart(x[0], y[0]);
    const surnameTypo = firstExact && isOneEditApart(xLast, yLast);
    if ((firstTypo && surnameStrong) || surnameTypo) return 'typo';

    const firstPrefix = x[0].startsWith(y[0]) || y[0].startsWith(x[0]);
    if (firstExact || firstPrefix) return 'weak';
    return 'none';
}
function locationEvidence(person, ocr) {
    const p = parseCabinParts(person.cabinBed), o = parseCabinParts(ocr.cabinBed);
    if (p.full === o.full) return 'exact';
    if (p.base && p.base === o.base && p.bed && o.bed && p.bed !== o.bed) return 'wrong_bed';
    return 'wrong_cabin';
}
function buildLogicalOcr(records) {
    const grouped = new Map();
    for (const record of records) {
        const cabinBed = record.cabin_bed || record.cabinBed || '';
        const name = record.name_tag || record.name || '';
        const key = `${normalizeKey(cabinBed)}|${normalizeName(name)}`;
        if (!grouped.has(key)) grouped.set(key, { key, cabinBed, name, observations: [] });
        grouped.get(key).observations.push(record);
    }
    return [...grouped.values()].sort((a, b) => a.key.localeCompare(b.key)).map((item, index) => ({
        ...item,
        id: `ocr-${index + 1}`,
        duplicateCount: item.observations.length,
        sourceFiles: [...new Set(item.observations.map(o => o.sourceFile).filter(Boolean))].sort(),
        occurrences: [...item.observations.reduce((counts, observation) => {
            const sourceFile = observation.sourceFile || 'ไม่ทราบไฟล์';
            counts.set(sourceFile, (counts.get(sourceFile) || 0) + 1);
            return counts;
        }, new Map())].sort(([a], [b]) => a.localeCompare(b))
            .map(([sourceFile, count]) => ({ sourceFile, count })),
    }));
}
function evidenceFor(edge) {
    if (!edge) return null;
    return {
        nameEvidence: edge.nameLevel,
        locationEvidence: edge.locationLevel,
        duplicateCount: edge.ocr.duplicateCount,
        sourceFiles: [...edge.ocr.sourceFiles],
    };
}
function setMatchResult(entry, status, code, reason, edge = null, assigned = false) {
    const p = entry.person;
    p.matchStatus = status;
    p.matchReasonCode = code;
    p.reviewReason = reason;
    p.assignedOcrId = assigned && edge ? edge.ocr.id : null;
    p.matchEvidence = evidenceFor(edge);
    p.sourceFile = edge?.ocr.sourceFiles.join(', ') || null;
    p.ocrCabin = edge?.ocr.cabinBed || null;
    p.ocrName = edge?.ocr.name || null;
}
function assignEdge(entry, edge, status, code, reason, assignedPeople, assignedOcr) {
    setMatchResult(entry, status, code, reason, edge, true);
    assignedPeople.add(entry.index);
    assignedOcr.add(edge.ocrIndex);
}
function matchAll(scanContext = {}) {
    const people = allPeople().map((person, index) => ({ person, index }));
    const logicalOcr = buildLogicalOcr(ocrResults);
    const edges = [];
    for (const entry of people) {
        const p = entry.person;
        p.matchStatus = 'absent';
        p.matchReasonCode = null;
        p.reviewReason = null;
        p.assignedOcrId = null;
        p.matchEvidence = null;
        p.sourceFile = null;
        p.ocrCabin = null;
        p.ocrName = null;
        logicalOcr.forEach((ocr, ocrIndex) => edges.push({
            personIndex: entry.index,
            ocrIndex,
            entry,
            ocr,
            nameLevel: compareNames(p.name, ocr.name),
            locationLevel: locationEvidence(p, ocr),
        }));
    }

    const strong = edge => edge.nameLevel === 'exact' || edge.nameLevel === 'abbreviation';
    const blockedPeople = new Set();
    const assignedPeople = new Set();
    const assignedOcr = new Set();

    const duplicatePob = new Map();
    for (const entry of people) {
        const key = `${normalizeKey(entry.person.cabinBed)}|${normalizeName(entry.person.name)}`;
        if (!duplicatePob.has(key)) duplicatePob.set(key, []);
        duplicatePob.get(key).push(entry);
    }
    for (const group of duplicatePob.values()) {
        if (group.length < 2) continue;
        const indexes = new Set(group.map(entry => entry.index));
        const competes = edges.some(edge => indexes.has(edge.personIndex) && edge.locationLevel === 'exact' && strong(edge));
        if (!competes) continue;
        for (const entry of group) {
            setMatchResult(entry, 'review', 'duplicate_pob_record',
                `ข้อมูล POB ซ้ำที่ ${entry.person.cabinBed} สำหรับ "${entry.person.name}" — ไม่เลือกแถวใดอัตโนมัติ`);
            blockedPeople.add(entry.index);
        }
    }

    for (const entry of people) {
        if (blockedPeople.has(entry.index)) continue;
        const personEdges = edges.filter(edge => edge.personIndex === entry.index);
        const atLocation = personEdges.filter(edge => edge.locationLevel === 'exact');
        const strongAtLocation = atLocation.filter(strong);
        const distinctLocationNames = new Set(atLocation.map(edge => normalizeName(edge.ocr.name)));
        const typoAtLocation = atLocation.filter(edge => edge.nameLevel === 'typo');
        const strongAway = personEdges.filter(edge => edge.locationLevel !== 'exact' && strong(edge));
        if (distinctLocationNames.size > 1 && strongAtLocation.length) {
            setMatchResult(entry, 'review', 'conflicting_evidence',
                `พบป้ายหลายชื่อที่ตำแหน่ง ${entry.person.cabinBed} — ต้องตรวจสอบข้อมูลจากรูป`);
            blockedPeople.add(entry.index);
        } else if (!strongAtLocation.length && typoAtLocation.length && strongAway.length) {
            setMatchResult(entry, 'review', 'conflicting_evidence',
                `หลักฐานขัดแย้ง: ชื่อคล้ายที่ ${entry.person.cabinBed} แต่พบชื่อตรงในตำแหน่งอื่น — ไม่จับคู่อัตโนมัติ`);
            blockedPeople.add(entry.index);
        }
    }

    const exactStrongByOcr = new Map();
    for (const edge of edges.filter(edge => edge.locationLevel === 'exact' && strong(edge) && !blockedPeople.has(edge.personIndex))) {
        if (!exactStrongByOcr.has(edge.ocrIndex)) exactStrongByOcr.set(edge.ocrIndex, []);
        exactStrongByOcr.get(edge.ocrIndex).push(edge);
    }
    for (const candidates of exactStrongByOcr.values()) {
        if (candidates.length < 2) continue;
        for (const edge of candidates) {
            if (blockedPeople.has(edge.personIndex)) continue;
            setMatchResult(edge.entry, 'review', 'ambiguous_pob_candidates',
                `ป้าย ${edge.ocr.cabinBed} "${edge.ocr.name}" ตรงกับ POB มากกว่าหนึ่งคน — ไม่เลือกอัตโนมัติ`);
            blockedPeople.add(edge.personIndex);
        }
    }

    for (const entry of people) {
        if (blockedPeople.has(entry.index)) continue;
        const candidates = edges.filter(edge => edge.personIndex === entry.index &&
            edge.locationLevel === 'exact' && strong(edge) && !assignedOcr.has(edge.ocrIndex));
        if (candidates.length > 1) {
            setMatchResult(entry, 'review', 'ambiguous_ocr_candidates',
                `พบป้ายที่เป็นไปได้มากกว่าหนึ่งป้ายสำหรับ ${entry.person.cabinBed} "${entry.person.name}"`);
            blockedPeople.add(entry.index);
        } else if (candidates.length === 1) {
            const edge = candidates[0];
            const code = edge.nameLevel === 'exact'
                ? 'exact_location_exact_name' : 'exact_location_abbreviated_name';
            assignEdge(entry, edge, 'ok', code, null, assignedPeople, assignedOcr);
        }
    }

    function assignStrongTier(locationLevel, reasonCode, reasonText) {
        const available = edges.filter(edge => edge.locationLevel === locationLevel && strong(edge) &&
            !blockedPeople.has(edge.personIndex) && !assignedPeople.has(edge.personIndex) && !assignedOcr.has(edge.ocrIndex));
        const byPerson = new Map(), byOcr = new Map();
        for (const edge of available) {
            if (!byPerson.has(edge.personIndex)) byPerson.set(edge.personIndex, []);
            if (!byOcr.has(edge.ocrIndex)) byOcr.set(edge.ocrIndex, []);
            byPerson.get(edge.personIndex).push(edge);
            byOcr.get(edge.ocrIndex).push(edge);
        }
        for (const candidates of byPerson.values()) {
            if (candidates.length < 2) continue;
            const entry = candidates[0].entry;
            setMatchResult(entry, 'review', 'ambiguous_ocr_candidates',
                `พบป้ายชื่อที่เป็นไปได้หลายตำแหน่งสำหรับ "${entry.person.name}" — ไม่เลือกอัตโนมัติ`);
            blockedPeople.add(entry.index);
        }
        for (const candidates of byOcr.values()) {
            const active = candidates.filter(edge => !blockedPeople.has(edge.personIndex));
            if (active.length < 2) continue;
            for (const edge of active) {
                setMatchResult(edge.entry, 'review', 'ambiguous_pob_candidates',
                    `ป้าย ${edge.ocr.cabinBed} "${edge.ocr.name}" ตรงกับ POB มากกว่าหนึ่งคน — ไม่เลือกอัตโนมัติ`);
                blockedPeople.add(edge.personIndex);
            }
        }
        for (const edge of available) {
            if (blockedPeople.has(edge.personIndex) || assignedPeople.has(edge.personIndex) || assignedOcr.has(edge.ocrIndex)) continue;
            const personCandidates = byPerson.get(edge.personIndex).filter(e => !blockedPeople.has(e.personIndex));
            const ocrCandidates = byOcr.get(edge.ocrIndex).filter(e => !blockedPeople.has(e.personIndex));
            if (personCandidates.length !== 1 || ocrCandidates.length !== 1) continue;
            assignEdge(edge.entry, edge, 'review', reasonCode, reasonText(edge), assignedPeople, assignedOcr);
        }
    }

    assignStrongTier('wrong_bed', 'wrong_bed', edge =>
        `ชื่อตรงแต่เตียงไม่ตรง: รูป ${edge.ocr.cabinBed} "${edge.ocr.name}" · POB ${edge.entry.person.cabinBed} "${edge.entry.person.name}"`);
    assignStrongTier('wrong_cabin', 'wrong_cabin', edge =>
        `ชื่อตรงแต่ห้องไม่ตรง: รูป ${edge.ocr.cabinBed} "${edge.ocr.name}" · POB ${edge.entry.person.cabinBed} "${edge.entry.person.name}"`);

    const typoEdges = edges.filter(edge => edge.locationLevel === 'exact' && edge.nameLevel === 'typo' &&
        !blockedPeople.has(edge.personIndex) && !assignedPeople.has(edge.personIndex) && !assignedOcr.has(edge.ocrIndex));
    const typoByPerson = new Map(), typoByOcr = new Map();
    for (const edge of typoEdges) {
        if (!typoByPerson.has(edge.personIndex)) typoByPerson.set(edge.personIndex, []);
        if (!typoByOcr.has(edge.ocrIndex)) typoByOcr.set(edge.ocrIndex, []);
        typoByPerson.get(edge.personIndex).push(edge);
        typoByOcr.get(edge.ocrIndex).push(edge);
    }
    for (const edge of typoEdges) {
        if (blockedPeople.has(edge.personIndex) || assignedPeople.has(edge.personIndex) || assignedOcr.has(edge.ocrIndex)) continue;
        if (typoByPerson.get(edge.personIndex).length !== 1 || typoByOcr.get(edge.ocrIndex).length !== 1) {
            setMatchResult(edge.entry, 'review', 'conflicting_evidence',
                `ชื่อ OCR ใกล้เคียงแต่มีผู้สมัครหลายรายการ — ไม่จับคู่อัตโนมัติ`, edge, false);
            blockedPeople.add(edge.personIndex);
            continue;
        }
        assignEdge(edge.entry, edge, 'review', 'conservative_name_typo',
            `ชื่อ OCR อาจสะกดคลาดเคลื่อนที่ตำแหน่งตรงกัน: รูป "${edge.ocr.name}" · POB "${edge.entry.person.name}"`,
            assignedPeople, assignedOcr);
    }

    for (const entry of people) {
        if (blockedPeople.has(entry.index) || assignedPeople.has(entry.index)) continue;
        const atLocation = edges.filter(edge => edge.personIndex === entry.index && edge.locationLevel === 'exact');
        if (atLocation.length) {
            const edge = atLocation[0];
            const code = atLocation.length > 1 ? 'conflicting_evidence' : 'location_name_conflict';
            const reason = atLocation.length > 1
                ? `พบป้ายหลายชื่อที่ตำแหน่ง ${entry.person.cabinBed} — ต้องตรวจสอบข้อมูลจากรูป`
                : `ตำแหน่ง ${entry.person.cabinBed} เป็น "${edge.ocr.name}" แต่ POB เป็น "${entry.person.name}"`;
            setMatchResult(entry, 'review', code, reason, edge, false);
        } else if (scanContext.totalImages > 0 && scanContext.failedImages > 0) {
            const allFailed = !scanContext.successfulImages;
            setMatchResult(entry, 'review', allFailed ? 'ocr_unavailable' : 'partial_ocr_failure',
                allFailed ? 'OCR ไม่สำเร็จ จึงยังสรุปว่าไม่พบไม่ได้' : 'OCR บางรูปไม่สำเร็จ จึงต้องตรวจสอบรายชื่อนี้');
        } else {
            setMatchResult(entry, 'absent', 'no_ocr_match',
                `ไม่พบชื่อ "${entry.person.name}" ใน OCR จากรูปที่ประมวลผลสำเร็จ (POB ${entry.person.cabinBed})`);
        }
    }

    const duplicateOcr = logicalOcr.filter(ocr => ocr.duplicateCount > 1).map(ocr => ({
        id: ocr.id,
        cabinBed: ocr.cabinBed,
        name: ocr.name,
        duplicateCount: ocr.duplicateCount,
        extraCount: ocr.duplicateCount - 1,
        sourceFiles: [...ocr.sourceFiles],
        occurrences: ocr.occurrences.map(item => ({ ...item })),
    }));
    matchingDiagnostics = {
        logicalOcrCount: logicalOcr.length,
        duplicateOcr,
        extraDuplicateCount: duplicateOcr.reduce((sum, ocr) => sum + ocr.extraCount, 0),
        unassignedOcr: logicalOcr.filter((_, index) => !assignedOcr.has(index)).map(ocr => ({
            id: ocr.id,
            cabinBed: ocr.cabinBed,
            name: ocr.name,
            duplicateCount: ocr.duplicateCount,
            sourceFiles: [...ocr.sourceFiles],
        })),
    };
    renderDuplicateWarnings();
    populateCabinDatalist();
}
function effectiveStatus(p) { return p.userOverride ?? p.matchStatus; }
function countSt(arr, st) { return arr.filter(p => effectiveStatus(p) === st).length; }

function populateCabinDatalist() {
    const vals = new Set();
    for (const p of allPeople()) {
        vals.add(p.cabinBed);
        const pt = parseCabinParts(p.cabinBed);
        if (pt.base) vals.add(pt.base);
    }
    document.getElementById('cabinDatalist').innerHTML =
        [...vals].sort().map(v => `<option value="${esc(v)}">`).join('');
}

function renderImageChips(stats) {
    document.getElementById('imgScanCount').textContent = stats.length;
    document.getElementById('imgTagTotal').textContent = stats.reduce((s,x) => s + (x.tagCount||0), 0);
    document.getElementById('imageSummaryRows').innerHTML = stats.map(s =>
        `<div class="img-chip"><span style="opacity:.75;word-break:break-all">${esc(s.fileName)}</span><b>${s.tagCount}</b></div>`
    ).join('');
}

function renderDuplicateWarnings() {
    const panel = document.getElementById('duplicateTagPanel');
    const summary = document.getElementById('duplicateTagSummary');
    const rows = document.getElementById('duplicateTagRows');
    const duplicates = matchingDiagnostics.duplicateOcr || [];
    const extraCount = matchingDiagnostics.extraDuplicateCount || 0;

    if (!duplicates.length) {
        panel.classList.add('hidden');
        summary.textContent = '⚠️ ไม่พบป้ายซ้ำ';
        rows.innerHTML = '';
        return;
    }

    panel.classList.remove('hidden');
    summary.textContent = `⚠️ พบป้ายซ้ำ ${duplicates.length} รายการ · ป้ายเกิน ${extraCount} ป้าย`;
    rows.innerHTML = duplicates.map(item => {
        const sources = item.occurrences.map(source =>
            `${esc(source.sourceFile)} × ${source.count}`
        ).join(' · ');
        return `<div class="person-row row-review">
            <div class="person-top">
                <span><b>${esc(item.cabinBed)}</b> ${esc(item.name)}</span>
                <span>⚠️</span>
            </div>
            <div class="person-meta">พบ ${item.duplicateCount} ครั้ง · ป้ายเกิน ${item.extraCount} ป้าย</div>
            <div class="person-meta" style="color:#fbbf24">↳ รูป: ${sources}</div>
        </div>`;
    }).join('');
}

function setStatusFilter(st) {
    filterStatus = filterStatus === st ? null : st;
    renderUI();
    scrollToResults();
}
function setSectionFilter(sec) {
    filterSection = filterSection === sec ? null : sec;
    renderUI();
    scrollToResults();
}
function clearFilters() {
    filterStatus = null; filterSection = null;
    document.getElementById('filterCabin').value = '';
    document.getElementById('filterName').value = '';
    renderUI();
}
function scrollToResults() {
    document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function personVisible(p, sec) {
    if (filterSection && filterSection !== sec) return false;
    if (filterStatus && effectiveStatus(p) !== filterStatus) return false;
    const cq = normalizeKey(document.getElementById('filterCabin').value.trim());
    const nq = document.getElementById('filterName').value.trim().toUpperCase();
    if (cq) {
        const pt = parseCabinParts(p.cabinBed);
        if (!normalizeKey(p.cabinBed).includes(cq) && !pt.base.includes(cq)) return false;
    }
    if (nq && !p.name.includes(nq)) return false;
    return true;
}

function setOverride(sec, idx, val) {
    pobData[sec][idx].userOverride = val;
    renderUI();
}

function renderUI() {
    const all = allPeople();
    document.getElementById('nOk').textContent = countSt(all, 'ok');
    document.getElementById('nReview').textContent = countSt(all, 'review');
    document.getElementById('nAbsent').textContent = countSt(all, 'absent');

    ['ok','review','absent'].forEach(st => {
        document.getElementById('pill' + st.charAt(0).toUpperCase() + st.slice(1))
            .classList.toggle('active', filterStatus === st);
    });
    ['marine','catering','passenger'].forEach(s => {
        document.getElementById('box' + s.charAt(0).toUpperCase() + s.slice(1))
            .classList.toggle('active', filterSection === s);
    });

    function fmtSec(arr, el) {
        const ok = countSt(arr,'ok'), rv = countSt(arr,'review'), ab = countSt(arr,'absent');
        document.getElementById(el).innerHTML =
            `<span style="color:#86efac">${ok}</span>/${arr.length}` +
            (rv ? ` <span style="color:#fde047;font-size:.6rem">⚠${rv}</span>` : '') +
            (ab ? ` <span style="color:#fca5a5;font-size:.6rem">❌${ab}</span>` : '');
    }
    fmtSec(pobData.marine, 'c-marine');
    fmtSec(pobData.catering, 'c-catering');
    fmtSec(pobData.passenger, 'c-pax');

    const tc = { ok: countSt(all,'ok'), review: countSt(all,'review'), absent: countSt(all,'absent') };
    document.getElementById('totalSummary').innerHTML =
        `✅ ${tc.ok} · ⚠️ ${tc.review} · ❌ ${tc.absent} · รวม ${all.length} คน`;

    const labels = [];
    if (filterStatus) labels.push({ ok:'เจอตรง', review:'ตรวจสอบ', absent:'ไม่พบ' }[filterStatus]);
    if (filterSection) labels.push(SECTIONS.find(s=>s.key===filterSection)?.label);
    const cq = document.getElementById('filterCabin').value.trim();
    const nq = document.getElementById('filterName').value.trim();
    if (cq) labels.push(`ห้อง "${cq}"`);
    if (nq) labels.push(`ชื่อ "${nq}"`);
    document.getElementById('filterActiveLabel').textContent =
        labels.length ? 'กรอง: ' + labels.join(' · ') : '';

    const order = { review: 0, absent: 1, ok: 2 };
    let html = '', shown = 0;
    for (const { key, label } of SECTIONS) {
        const items = pobData[key].map((p, idx) => ({ p, idx, sec: key }))
            .filter(x => personVisible(x.p, key))
            .sort((a,b) => order[effectiveStatus(a.p)] - order[effectiveStatus(b.p)]);
        if (!items.length) continue;
        const c = { ok: countSt(items.map(x=>x.p),'ok'), review: countSt(items.map(x=>x.p),'review'),
            absent: countSt(items.map(x=>x.p),'absent') };
        shown += items.length;
        html += `<div class="sec-hdr">${label} — ✅${c.ok} ⚠️${c.review} ❌${c.absent} (${items.length})</div`;
        for (const { p, idx, sec } of items) {
            const st = effectiveStatus(p);
            const cls = st === 'ok' ? 'row-ok' : st === 'review' ? 'row-review' : 'row-absent';
            const icon = st === 'ok' ? '✅' : st === 'review' ? '⚠️' : '❌';
            let meta = '';
            if (p.reviewReason) meta += `<div class="person-meta">${esc(p.reviewReason)}</div>`;
            if (p.sourceFile) meta += `<div class="person-meta" style="color:#fbbf24">↳ รูป: <b>${esc(p.sourceFile)}</b></div>`;
            html += `<div class="person-row ${cls}">
                <div class="person-top">
                    <span style="font-size:.85rem"><b>${esc(p.cabinBed)}</b> ${esc(p.name)}</span>
                    <span style="font-size:1.15rem">${icon}</span>
                </div>${meta}
                <div class="btn-row">
                    <button type="button" class="btn-sm ${p.userOverride==='ok'?'active':''}" onclick="setOverride('${sec}',${idx},'ok')">✅ พบ</button>
                    <button type="button" class="btn-sm ${p.userOverride==='absent'?'active':''}" onclick="setOverride('${sec}',${idx},'absent')">❌ ไม่พบ</button>
                    <button type="button" class="btn-sm" onclick="setOverride('${sec}',${idx},null)">↩ auto</button>
                </div>
            </div>`;
        }
    }
    document.getElementById('results').innerHTML = html ||
        '<div style="text-align:center;color:#94a3b8;padding:2rem">ไม่พบรายชื่อตามตัวกรอง</div>';
    if (labels.length && !html.includes('person-row'))
        document.getElementById('results').innerHTML =
        '<div style="text-align:center;color:#94a3b8;padding:2rem">ไม่พบรายชื่อ — กด "ล้างตัวกรอง"</div>';
}

document.getElementById('filterCabin').addEventListener('input', () => { renderUI(); scrollToResults(); });
document.getElementById('filterName').addEventListener('input', () => { renderUI(); scrollToResults(); });
</script>
